<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.data.site.name }}</title>
<meta name="description" content="{{ page.summary | default: site.data.site.tagline | escape }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header class="nav">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.data.site.name }}</a>
    <ul>
      <li><a href="{{ '/#science' | relative_url }}">Science</a></li>
      <li><a href="{{ '/#kitchen' | relative_url }}">Kitchen</a></li>
      <li><a href="{{ '/#farm' | relative_url }}">Farm</a></li>
      <li><a href="{{ '/#studio' | relative_url }}">Studio</a></li>
      <li><a href="{{ '/#trails' | relative_url }}">Trails</a></li>
      <li><a href="{{ '/#contact' | relative_url }}">Contact</a></li>
    </ul>
  </div>
</header>
<main class="wrap" id="top">
{{ content }}
</main>
<footer class="wrap site-foot">
  <p class="fine">© {{ site.time | date: "%Y" }} {{ site.data.site.name }} · {{ site.data.site.footer_note }}</p>
</footer>
<script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
