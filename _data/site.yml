name: Maryam Hejri
tagline: biophysicist · painter · food enthusiast · balcony gardener ·
  photography enthusiast · hiker
headline: I study how bacteria grow, and I grow a few things myself.
bio: "By day I work on the physics of bacterial colonies: how they spread, how
  they stop, and how droplets decide where cells land. The rest of the time I'm
  in the garden, at the easel, in the kitchen, or somewhere on a trail with a
  camera. This is where I keep all of it."
