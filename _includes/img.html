{% if include.src and include.src != "" %}<img class="pic {{ include.class }}" src="{{ include.src | relative_url }}" alt="{{ include.alt | escape }}" loading="lazy">{% else %}<div class="ph {{ include.v }} {{ include.class }}" role="img" aria-label="{{ include.alt | escape }}"><span>{{ include.label | default: "Add a photo" }}</span></div>{% endif %}
